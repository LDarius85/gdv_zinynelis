  <h2>IŠDĖSTYMO SCHEMOS</h2>
  <h4><span style="background-color: rgba(255, 192, 0, 0.3);">Schemose priimta:</span></h4>
  <p>- magistralinės žarnos 77 mm; slėgis prie  švirkštų 4 atm.;
  <br>- darbinių žarnų ilgis  60 m; vietovės reljefas neįvertintas;
  <br>- schemose duoti galimi  maksimalūs atstumai.
  <br>- schemose atstumai taikomi kai siurblio našumas 40 l/s.</p>
